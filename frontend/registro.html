<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Mercado VIVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Martian+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main class="portada">
  <div class="portada__caja">
    <h1 class="portada__titulo">Crear cuenta</h1>
    <p class="bloque__ayuda" style="margin-bottom:1.4rem">
      Para gestionar las devoluciones de sus compras en Mercado VIVA
    </p>

    <div class="tarjeta">
      <div id="aviso" class="aviso aviso--error" hidden></div>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" placeholder="Ana María Restrepo">
      </div>

      <div class="campo">
        <label for="documento">Documento de identidad</label>
        <input id="documento" type="text" inputmode="numeric" autocomplete="off"
               placeholder="1017234567">
        <div class="campo__nota">Solo números. Es el que le pedirán en la tienda.</div>
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="email" placeholder="ana@correo.com">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="new-password">
        <div class="campo__nota">Mínimo 8 caracteres, con al menos una letra y un número.</div>
      </div>

      <div class="campo">
        <label for="password2">Repita la contraseña</label>
        <input id="password2" type="password" autocomplete="new-password">
      </div>

      <label style="display:flex;align-items:center;gap:.5rem;font-size:.9rem;margin-bottom:1.1rem;cursor:pointer">
        <input type="checkbox" id="ver" style="width:auto;margin:0">
        Mostrar las contraseñas
      </label>

      <button id="crear" class="boton boton--principal boton--ancho boton--grande">
        Crear mi cuenta
      </button>

      <div class="portada__pie">
        ¿Ya tiene cuenta? <a href="index.html">Inicie sesión</a>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
